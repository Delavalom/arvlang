# staticcheck (https://staticcheck.dev) settings for CI's lint job.
# The default set, minus three style checks this code base breaks on purpose:
#   ST1008  llmgate.go returns (value, error, bool) where the order reads best.
#   ST1018  check_cli tests hold bidi and zero-width characters literally,
#           because the test is about how arv check prints them.
#   S1016   logged.go spells out struct literals between the log's and the
#           runtime's grant types, so a field added to one is a compile error.
checks = ["all", "-ST1000", "-ST1003", "-ST1016", "-ST1020", "-ST1021", "-ST1022", "-ST1023", "-ST1008", "-ST1018", "-S1016"]
